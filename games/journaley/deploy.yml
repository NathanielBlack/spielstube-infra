---
# Deploy Journaley
# Usage: ansible-playbook games/journaley/deploy.yml
- name: Deploy Journaley
  hosts: spielstube
  vars_files:
    - ../../inventory/vault.yml
    - vars.yml
  vars:
    game_name: journaley
    game_compose_template: "{{ playbook_dir }}/docker-compose.yml.j2"
    game_env_template: "{{ playbook_dir }}/env.j2"
  roles:
    - game
