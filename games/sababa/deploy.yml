---
# Deploy Sababa Telegram bot
# Usage: ansible-playbook games/sababa/deploy.yml
- name: Deploy Sababa bot
  hosts: spielstube
  vars_files:
    - ../../inventory/vault.yml
    - vars.yml
  vars:
    game_name: sababa
    game_compose_template: "{{ playbook_dir }}/docker-compose.yml.j2"
    game_env_template: "{{ playbook_dir }}/env.j2"
  roles:
    - game
